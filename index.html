<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Same as slop-animator: device-width so iPad is not a 980px desktop page scaled up.
         user-scalable=no is ignored by modern iOS; touch-action: manipulation on #app is what
         actually kills double-tap-to-zoom. No viewport-fit=cover (home-indicator insets). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Declaring both means no browser falls back to requesting /favicon.ico: SVG where supported
         , PNG elsewhere — Safari ignores SVG favicons entirely. The mark is the shared slop mark in
         spine's yellow (#ffe566, ../SLOP-FAVICON-COLOURS.md); the PNGs put it on the app's dark plate. All of it is
         generated from public/favicon.svg by tools/make-icons.mjs. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icon-180.png" />
    <title>slop-spine</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
